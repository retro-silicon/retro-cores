name: Setup
description: JDK, sbt, Verilator, and cc65 and Pillow for building test ROMs
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: sbt
    - uses: sbt/setup-sbt@v1
    - shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq verilator cc65 python3-pil
