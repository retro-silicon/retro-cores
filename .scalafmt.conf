# Close to the hand-written style: wide lines, packed parameter lists, uppercase hex.
version = 3.9.4
runner.dialect = scala213
maxColumn = 160
newlines.avoidForSimpleOverflow = [tooLong, punct, slc]
binPack.defnSite = always
binPack.callSite = always
danglingParentheses.preset = false
align.preset = none
align.openParenDefnSite = true
docstrings.style = keep
docstrings.forceBlankLineBefore = false
literals.hexDigits = Upper
