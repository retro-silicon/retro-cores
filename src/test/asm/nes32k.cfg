# 32 KB of PRG as four 8 KB banks (BANK0-BANK2, then the code in the last, which every
# supported mapper fixes at E000), then CHR.
MEMORY {
  ZP: start = $00, size = $100, type = rw;
  HDR: start = 0, size = $10, file = %O, fill = yes;
  B0: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
  B1: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
  B2: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
  FIXED: start = $E000, size = $2000, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
  ZEROPAGE: load = ZP, type = zp;
  HEADER: load = HDR, type = ro;
  BANK0: load = B0, type = ro, optional = yes;
  BANK1: load = B1, type = ro, optional = yes;
  BANK2: load = B2, type = ro, optional = yes;
  CODE: load = FIXED, type = ro;
  VECTORS: load = FIXED, type = ro, start = $FFFA;
}
